services:
  - type: web
    name: speakmate-ai
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SPEAKMATE_DB
        value: /tmp/speakmate.sqlite
      - key: NEXT_PUBLIC_SPEAKMATE_DEMO
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: SPEAKMATE_SIGNUP_CODE
        sync: false
